name: smart_inventory
description: "A complete, production-ready Smart Inventory & Stock Replenishment mobile application with offline support."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management - Riverpod
  flutter_riverpod: ^2.4.8
  riverpod_annotation: ^2.3.0

  # Local Storage - Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Routing
  go_router: ^13.0.0

  # UI & Material Design 3
  intl: ^0.19.0
  cached_network_image: ^3.3.0

  # Networking
  http: ^1.1.0

  # Utils
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0

  # Barcode & QR Code Scanning
  mobile_scanner: ^3.5.0
  qr_code_scanner: ^1.0.1

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generation for Riverpod
  riverpod_generator: ^2.3.7
  build_runner: ^2.4.6

  # Code Generation for Hive
  hive_generator: ^2.0.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
